<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="manifest" href="/manifest.webmanifest">

<meta name="theme-color" content="#c22400">

<link rel="apple-touch-icon" href="/img/logo.jpg">

    <title>Painel Administrativo | COPAGAZ</title>

    <link rel="stylesheet" href="adm.css">
</head>

<body>



    <section class="login-area" id="login-area">

        <div class="login-box">

            <div class="login-logo">
                <img src="img/logo.jpg" alt="" srcset="">
            </div>

            <h1>COPAGAZ</h1>

            <p>Painel Administrativo</p>


            <div class="login-field">

                <label for="admin-email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="admin-email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                >

            </div>


            <div class="login-field">

                <label for="admin-senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="admin-senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                >

            </div>


            <p
                class="login-error"
                id="login-error"
            ></p>


            <button
                type="button"
                class="btn-login"
                id="btn-login"
            >
                Entrar
            </button>

        </div>

    </section>

    <div class="header">
        <div class="logo">
            <img src="img/logo.png" alt="Logo">
            <div class="logo-text">
                <h1>COPAGAZ</h1>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="index.html#produtos">Produtos</a></li>
                <li><a href="adm.html">ADM</a></li>
                <li><a href="#"><img src="img/telephone.png" alt="Ícone de telefone azul em estilo minimalista, mostrando um aparelho de telefone antigo com fio, em um fundo escuro e simples. O objeto está centralizado e destaca-se por contraste, com uma aparência limpa e profissional. O ambiente é neutro e minimalista, sem elementos distrativos. Título visual do ícone: nenhum texto. Tom emocional: simples, confiável e funcional." srcset="img"></a></li>
            </ul>
        </nav>
    </div>
</header>

<div class="painel">
    <h1>PAINEL DE PRODUTOS</h1>

<div class="produtos">


<div class="Agua">

    <input type="text" placeholder="Digite Um novo NOME">
    <input type="number" placeholder="Digite Um novo PREÇO" id="precoAgua">
<img src="img/3.png" alt="Água Mineral">

<div class="Salvar">
    
    <button>Salvar Alterações</button>
</div>


<div class="Gas">

    <input type="text" placeholder="Digite Um novo NOME">
    <input type="number" placeholder="Digite Um novo PREÇO" id="precoGas">
<img src="img/4.png" alt="Gás de cozinha">

<div class="Salvar">
    
    <button>Salvar Alterações</button>
</div>

    </div>
</footer>
