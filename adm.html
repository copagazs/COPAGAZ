<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | COPAGAZ</title>
    <link rel="stylesheet" href="adm.css">
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="img/logo.png" alt="Logo">
            <div class="logo-text">
                <h1>COPAGAZ</h1>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
            </ul>
        </nav>
    </header>

    <section class="login-area" id="login-area">
        <div class="login-box">
            <div class="login-logo">
                <img src="img/logo.png" alt="Logo">
            </div>
            <h1>COPAGAZ</h1>
            <p>Painel Administrativo</p>

            <div class="login-field">
                <label for="admin-email">E-mail</label>
                <input type="email" id="admin-email" placeholder="Digite seu e-mail">
            </div>

            <div class="login-field">
                <label for="admin-senha">Senha</label>
                <input type="password" id="admin-senha" placeholder="Digite sua senha">
            </div>

            <p class="login-error" id="login-error"></p>
            <button type="button" class="btn-login" id="btn-login">Entrar</button>
        </div>
    </section>

    <div class="painel" id="painel-conteudo" style="display: none;">
        <h1>PAINEL DE PRODUTOS</h1>

        <div class="produtos-adm-grid">

            <div class="card-adm Agua">
                <h2>PRODUTO 1: ÁGUA</h2>
                
                <div class="campo-adm">
                    <label>NOME ATUAL:</label>
                    <div class="valor-atual" id="nome-atual-agua">Água Mineral</div>
                    <input type="text" placeholder="DIGITE UM NOME NOVO">
                </div>

                <div class="campo-adm">
                    <label>PREÇO DE RETIRADA ATUAL:</label>
                    <div class="valor-atual" id="retirada-atual-agua">R$ 12,00</div>
                    <input type="number" step="0.01" min="0" placeholder="NOVO PREÇO DE RETIRADA" id="retiradaAgua">

                    <label>PREÇO DE ENTREGA ATUAL:</label>
                    <div class="valor-atual" id="entrega-atual-agua">R$ 20,00</div>
                    <input type="number" step="0.01" min="0" placeholder="NOVO PREÇO DE ENTREGA" id="entregaAgua">
                </div>

                <img src="img/3.png" alt="Água Mineral">

                <div class="Salvar">
                    <button type="button">SALVAR ALTERAÇÕES</button>
                </div>
            </div>

            <div class="card-adm Gas">
                <h2>PRODUTO 2: GÁS</h2>

                <div class="campo-adm">
                    <label>NOME ATUAL:</label>
                    <div class="valor-atual" id="nome-atual-gas">Gás de cozinha</div>
                    <input type="text" placeholder="DIGITE UM NOME NOVO">
                </div>

                <div class="campo-adm">
                    <label>PREÇO DE RETIRADA ATUAL:</label>
                    <div class="valor-atual" id="retirada-atual-gas">R$ 105,00</div>
                    <input type="number" step="0.01" min="0" placeholder="NOVO PREÇO DE RETIRADA" id="retiradaGas">

                    <label>PREÇO DE ENTREGA ATUAL:</label>
                    <div class="valor-atual" id="entrega-atual-gas">R$ 120,00</div>
                    <input type="number" step="0.01" min="0" placeholder="NOVO PREÇO DE ENTREGA" id="entregaGas">
                </div>

                <img src="img/4.png" alt="Gás de cozinha">

                <div class="Salvar">
                    <button type="button">SALVAR ALTERAÇÕES</button>
                </div>
            </div>

        </div>

        <button type="button" id="btn-sair" class="btn-login" style="margin: 30px auto; display: block;">Sair do ADM</button>
    </div>

    <footer>
        <p>© 2024 COPAGAZ. Todos os direitos reservados.</p>
    </footer>

    <script type="module" src="adm.js"></script>
</body>
</html>
